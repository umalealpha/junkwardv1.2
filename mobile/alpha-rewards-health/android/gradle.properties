# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure.
android.useAndroidX=true

# Architectures to build for.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric/TurboModules).
# Deliberately OFF: the three health libraries are legacy-bridge modules and
# codegen for TurboModules would require a local NDK toolchain we don't have.
# Legacy architecture is still supported on RN 0.81 (removed in 0.82).
newArchEnabled=false

# Hermes JS engine.
hermesEnabled=true

# Edge-to-edge. Android 16 (targetSdk 36) draws behind the system bars and
# removed the opt-out, so App.tsx pads the root by the status-bar inset itself.
edgeToEdgeEnabled=false
