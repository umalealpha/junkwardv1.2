name: OmniStaff
options:
  bundleIdPrefix: co.bw.alphadirect
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  OmniStaff:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.bw.alphadirect.omnistaff
        PRODUCT_NAME: Alpha Omni
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/OmniStaff.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: Resources/Info.plist
      # xcodegen REWRITES this file from these properties every generate — so
      # everything Apple needs must live here, not in INFOPLIST_KEY_ settings.
      properties:
        CFBundleDisplayName: Alpha Omni
        CFBundleName: Alpha Omni
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: "Omni uses the camera so you can photograph an invoice, receipt or quote and attach it to a request."
        NSPhotoLibraryUsageDescription: "Omni needs access to your photos so you can attach an existing picture of an invoice, receipt or quote to a request."
        NSFaceIDUsageDescription: "Omni can use Face ID to unlock the app, so your approvals and payslips stay private if someone else picks up your phone."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
