[pytest]
# The engage specs are PURE python (no Django) and are the machine check the
# lane-b swarm builds against. They are named spec_* rather than test_* because
# Django's own runner discovers test*.py and these are not Django tests.
#
# 🔴 test_*.py MUST stay in this list. Setting only spec_*.py overrode pytest's
# default and silently collected ZERO of the 193 tests under
# claims/recoveries/tests/ — a green run that tested nothing.
python_files = spec_*.py test_*.py
