apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing. The upload key lives outside git: android/keystore.properties
// (storeFile / storePassword / keyAlias / keyPassword) next to android/app/release.keystore.
// Without that file the release build falls back to the DEBUG key, which Play will
// reject on upload — the build prints which key it used so this can never pass silently.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.alphadirect.rewardshealth"
    defaultConfig {
        applicationId "com.alphadirect.rewardshealth"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.1"
    }

    // 16 KB memory page size (Google Play, enforced 1 Nov 2025). Uncompressed +
    // page-aligned native libs in the bundle; the .so files themselves are 16 KB
    // aligned because RN 0.81 / Fresco 3.6 ship them that way.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProperties['storeFile'] ?: 'release.keystore')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// A debug-signed release bundle is worthless — Play rejects it on upload. Refuse to
// produce one rather than leave a file lying around that looks uploadable. Checked at
// configuration time, and only when a release artifact was actually asked for, so it
// fails in seconds instead of after a ten-minute build (and never blocks debug builds).
// Verification runs that only need to inspect icons/alignment must opt in explicitly:
//   gradlew :app:bundleRelease -PallowDebugSigning=true
def wantsRelease = gradle.startParameter.taskNames.any {
    it =~ /(?i)(bundle|assemble)Release/
}
if (wantsRelease) {
    if (hasReleaseKey) {
        println "SIGNING: release build will use the alpha-nexus UPLOAD key."
    } else if (project.hasProperty("allowDebugSigning")) {
        println "SIGNING: *** DEBUG-SIGNED (allowDebugSigning set). NOT uploadable to Play. ***"
    } else {
        throw new GradleException(
            "Refusing to build a release artifact: android/keystore.properties is missing, " +
            "so it would be signed with the DEBUG key and Google Play would reject the upload.\n" +
            "  Fix:   run set-signing-key.ps1 if you have the existing upload-key password,\n" +
            "         or create-upload-key.ps1 if the key is being replaced via a Play\n" +
            "         Console upload key reset (that script writes this file itself).\n" +
            "  Local check only: add -PallowDebugSigning=true")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
